name: PM Engine Tests

on:
  pull_request:
    paths: ["AURA-PMSkills/**", ".github/workflows/pm-engine-tests.yml"]
  push:
    branches: [main]
    paths: ["AURA-PMSkills/**", ".github/workflows/pm-engine-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: AURA-PMSkills
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Upstream plugin validator (vendored)
        run: python validate_plugins.py
        working-directory: AURA-PMSkills/pm-skills
      - name: Upstream consistency suite (vendored)
        run: python -m unittest discover -s tests -v
        working-directory: AURA-PMSkills/pm-skills
      - name: Upstream plugin validator (aura-skills)
        run: python pm-skills/validate_plugins.py aura-skills
      - name: Engine validate (pm-skills + aura-skills)
        run: pm-engine validate -v
      - name: Engine doctor
        run: pm-engine doctor
      - name: Engine test-suite
        run: python -m pytest tests -v
